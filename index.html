<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript string method</h2>
    <p id="num result"></p>
    <p id="str result"></p>
    <script>
    var x = (2);
    var y = (4);
    document.getElementById("num result").innerHTML = x*y;
    document.getElementById("str result").innerHTML = String(x) + String(y);
    </script>
</body>
</html>
